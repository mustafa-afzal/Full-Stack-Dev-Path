<html>
    <head>
       <link rel="stylesheet" href="index.css">
       <link rel="preconnect" href="https://fonts.googleapis.com">
       <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
       <link href="https://fonts.googleapis.com/css2?family=Arimo:ital,wght@0,400..700;1,400..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Karla:ital,wght@0,200..800;1,200..800&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&family=Smythe&family=Source+Sans+3:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">

    </head>
    <body>
        <div class="container">
            <img class="hero-img" src="images/burger.png">

            <div class="item-section">
                <p class="food"> 🍕 </p>
                <div class="section-text">
                    <h4> Pizza </h4>
                    <p> pepperoni, mushroom, mozaerella </p>
                    <h5> $14 </h5>
                </div>
                <button class="plus" data-item="0"> + </button>
            </div>

            <div class="item-section">
                <p class="food"> 🍔 </p>
                <div class="section-text">
                    <h4> Hamburger </h4>
                    <p> beef, cheese, lettuce </p>
                    <h5> $12 </h5>
                </div>
                <button class="plus" data-item="1"> + </button>
            </div>

            <div class="item-section">
                <p class="food"> 🍺 </p>
                <div class="section-text">
                    <h4> Beer </h4>
                    <p> grain, hops, yeast, water </p>
                    <h5> $12 </h5>
                </div>
                <button class="plus" data-item="2"> + </button>
            </div>

            <div id="order"></div>

            <div class="modal hidden"> 
                <div class="modal-inner">
                    <h2> Enter Card Details </h2>
                    <form>
                        <input placeholder="Enter your name" required>
                        <input placeholder="Enter card cumber" required>
                        <input placeholder="Enter CVV" required> 
                        <button class="complete-btn" id="payBtn">Pay Now</button>
                    </form>
                
                </div>
            </div>

        </div>
	<script src="index.js" type="module"></script>
    </body>
</html>
