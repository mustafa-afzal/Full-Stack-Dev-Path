<html>
    <head>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Arimo:ital,wght@0,400..700;1,400..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Karla:ital,wght@0,200..800;1,200..800&family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&family=Smythe&family=Source+Sans+3:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="container">
            <header>
                <div class="header-box">
                    <input type="color" id="color-choice">
                </div>
                <select id="scheme-choice">
                    <option> Monochrome </option>
                    <option> Monochrome-dark </option>
                    <option> Monochrome-light </option>
                    <option> Analogic </option>
                    <option> Complement </option>
                    <option> Analogic-complement </option>
                    <option> Triad </option>
                </select>

                <button class="btn" id="btn"> Get color scheme </button>
            </header>
            <main>
                <div id="random-colors"></div>
                <div class="hidden" id="copy-overlay"> Copied! </div>
            </main>
        </div>

        <script src="index.js"></script>
    </body>
</html>
