<html>
    <head>
        <link rel="stylesheet" href="index.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Arimo:ital,wght@0,400..700;1,400..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Karla:ital,wght@0,200..800;1,200..800&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    </head>
    <body>
        <div class="header"> 
            <h2> Metric/Imperial Unit Conversion </h2>
            <input type="number" id="num1">
            <button id="convert-btn"> Convert </button>
        </div>

        <div class="conversions"> 
            <div class="indv-conv">
                <h4> Length (Meter/Feet) </h4>
                <p id="meter-p"> </p>
            </div>

            <div class="indv-conv">
                <h4> Volume (Liters/Gallons) </h4>
                <p id="volume-p"> </p>
            </div>

            <div class="indv-conv">
                <h4> Mass (Kilograms/Pounds) </h4>
                <p id="mass-p"> </p>
            </div>

        </div>
        <script src="index.js"></script>
    </body>
</html>
